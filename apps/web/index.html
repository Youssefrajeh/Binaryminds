<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A marketplace, lost and found, and events board for Fanshawe College students — open only to people who actually go here."
    />
    <!-- Link previews; crawlers need absolute URLs, so update these if the site moves -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="campus-hub" />
    <meta property="og:title" content="campus-hub" />
    <meta
      property="og:description"
      content="A marketplace, lost and found, and events board for Fanshawe College students — open only to people who actually go here."
    />
    <meta property="og:url" content="https://campus-hub-229x.onrender.com/" />
    <meta property="og:image" content="https://campus-hub-229x.onrender.com/branding/campushub-minimal-monogram.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="campus-hub logo" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>campus-hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

services:
  - type: web
    name: campushub
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: fanshaweonline.ca

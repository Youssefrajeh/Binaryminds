services:
  - type: web
    name: campushub-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run prisma:generate -w @campushub/api && npm run build -w @campushub/api
    startCommand: npm run start -w @campushub/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: fanshaweonline.ca

  - type: web
    name: campushub-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build -w @campushub/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://campushub-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
